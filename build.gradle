plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            gameDirectory = project.file(project.findProperty('runDir') ?: 'run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url = 'https://maven.createmod.net' }            // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' }   // Registrate
    maven { url = 'https://maven.blamejared.com' }           // Veil and other transitive deps
    exclusiveContent {
        forRepository {
            maven {
                name = 'RyanHCode Maven'
                url = 'https://maven.ryanhcode.dev/releases'
            }
        }
        filter {
            includeGroupAndSubgroups 'dev.ryanhcode'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    // Create
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Sable physics (the engine behind Create Aeronautics), replaces Valkyrien Skies
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
    runtimeOnly("maven.modrinth:create-aeronautics:${create_aeronautics_modrinth_version}")

    // Xaero's Minimap waypoint integration (optional at runtime)
    compileOnly("maven.modrinth:xaeros-minimap:${xaero_minimap_modrinth_version}")
    compileOnly("maven.modrinth:xaeros-world-map:${xaero_worldmap_modrinth_version}")
    // XaeroLib ships inside the world map jar (jar-in-jar), so it isn't on Modrinth's maven
    compileOnly(files("libs/xaerolib-neoforge-1.21.1-1.7.3.jar"))

    // Unreal Frontiers Essential: backend HTTP client (UFHttpClient) for the schematics browser. Client-only.
    compileOnly(files("libs/ufessential-0.2.1-neoforge-1.21.1.jar"))

    // TACZ: which attachments and ammo fit a gun (IGun.allowAttachment, IAmmo.isAmmoOfGun) for the buy menu
    compileOnly(files("libs/tacz-neoforge-1.21.1-1.1.8-hotfix-r7.jar"))

    // Create Aeronautics: Toolgun. Its .excraft blueprints are the schematics players share and spawn as vehicles.
    compileOnly(files("libs/create_aeronautics_toolgun-0.3.6.jar"))

    // Golden vectors shared with the backend (src/test/resources/vectors) keep the pricing rules in sync
    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("com.google.code.gson:gson:2.10.1")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// The pricing tests only need plain Minecraft classes (NBT), not a running game: reuse the main classpath
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

tasks.named("test") {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
